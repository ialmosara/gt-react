[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# Redirects from the old WordPress site (globaltassels.org) to the new pages,
# so existing links, bookmarks and Google results keep working. All permanent
# (301). Netlify applies rules top to bottom and the first match wins, so these
# MUST stay above the catch-all at the bottom. A rule matches with or without a
# trailing slash. Old URLs came from the original site's page list (archived in
# content/globaltassels-org/pages-index.json).
# ---------------------------------------------------------------------------

# About (old WordPress site)
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301

[[redirects]]
  from = "/about-us/the-idea"
  to = "/about#our-story"
  status = 301

